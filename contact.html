<body>

<header>
  <div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         alt="Logo"
         style="width:35px; vertical-align:middle; margin-right:8px;">
    CareerConnect
  </div>

  <nav>
    <a href="index.html">Home</a>
 <a href="jobss.php">Jobs</a>

  </nav>

 <!-- <a href="login.html" class="btn-login">Login / Sign Up</a>-->
</header>

<!-- HERO -->
<section class="hero-contact">
  <h1>Contact Us</h1>
  <p>Have a question or feedback? Send us a message.</p>
</section>

<!-- CONTACT FORM -->
<section class="contact-section">
  <form id="contactForm">
    <h2>Send a Message</h2>

    <label>Name</label>
    <input type="text"
           id="name"
           name="name"
           placeholder="Enter your name">

    <label>Email</label>
    <input type="email"
           id="email"
           name="email"
           placeholder="Enter your email">

    <label>Subject</label>
    <input type="text"
           id="subject"
           name="subject"
           placeholder="Enter subject">

    <label>Message</label>
    <textarea id="message"
              name="message"
              placeholder="Write your message..."></textarea>

    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 CareerConnect. All rights reserved.</p>
</footer>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3 id="popupTitle"></h3>
    <p id="popupText"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script src="contact.js"></script>
</body>
</html>
