<section class="post-job">
  <form id="jobForm" action="postjob.php" method="POST">
    <h3>Post Job Opening</h3>

    <input type="text" name="company" placeholder="Company Name" required>
    <input type="text" name="title" placeholder="Job Title" required>

    <select name="job_type" required>
      <option value="">Select Job Type</option>
      <option value="Full Time">Full Time</option>
      <option value="Internship">Internship</option>
    </select>

    <input type="text" name="location" placeholder="Job Location" required>

    <select name="experience" required>
      <option value="">Experience / Batch</option>
      <option value="Fresher (2026)">Fresher (2026)</option>
      <option value="Fresher (2027)">Fresher (2027)</option>
      <option value="Fresher (2028)">Fresher (2028)</option>
      <option value="Experienced">Experienced</option>
    </select>

    <input type="text" name="salary" placeholder="Salary / Stipend">

    <input type="email" name="email" placeholder="Apply Email / HR Email" required>

    <button type="submit">Post Job</button>
  </form>
</section>
