<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cover Letter Templates</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6f8}

/* HEADER */
header{
  background:#0a66c2;color:#fff;padding:15px 25px;
  display:flex;align-items:center;gap:15px
}
header img{width:40px;height:40px}
header h2{margin:0}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:25px}
.card{
  background:#fff;padding:15px;border-radius:8px;
  box-shadow:0 4px 15px rgba(0,0,0,.1);text-align:center
}
.card img{width:60px;margin-bottom:10px}
.card button{
  width:100%;padding:10px;border:0;
  background:#0a66c2;color:#fff;border-radius:5px;cursor:pointer
}

/* VIEWER */
.viewer{padding:20px}
.hidden{display:none}
.actions{margin-bottom:15px}
.actions button, .actions input[type=color]{padding:8px 15px;margin-right:8px}

/* COVER LETTER BASE */
.letter{
  max-width:800px;margin:auto;background:#fff;
  min-height:1000px;padding:35px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  border-top:10px solid var(--accent)
}

/* HEADERS */
.header-left{background:var(--accent);color:#fff;padding:20px}
.header-center{text-align:center;border-bottom:3px solid var(--accent)}
.header-box{border:2px solid var(--accent);padding:20px}

/* SECTIONS */
.section{margin-bottom:18px}
.section h3{
  margin-bottom:6px;border-bottom:2px solid var(--accent);
  padding-bottom:4px
}

/* EDITABLE */
[contenteditable]{outline:1px dashed #aaa;padding:2px}
</style>
</head>

<body>

<header>
  <img src="coverlogo.webp">
  <h2>Cover Letter Templates</h2>
</header>

<div id="grid" class="grid"></div>

<div id="viewer" class="viewer hidden">
  <div class="actions">
    <input type="color" onchange="changeColor(this.value)">
    <button onclick="download()">Download PDF</button>
    <button onclick="closeView()">Exit</button>
  </div>
  <div id="letter"></div>
</div>

<script>
const logo="coverlogo.webp";

// 5-6 sample cover letter formats
const templates=[
  {n:"Classic Formal",h:"left",c:"#1e3a8a",s:["Your Address","Date","Recipient Info","Salutation","Body","Closing","Signature"]},
  {n:"Creative",h:"center",c:"#7c3aed",s:["Header","Greeting","Introduction","Body Paragraphs","Conclusion","Sign Off"]},
  {n:"Modern Professional",h:"box",c:"#0284c7",s:["Sender Info","Date","Recipient Info","Opening","Core Paragraph","Closing Remarks","Signature"]},
  {n:"Tech Job",h:"center",c:"#0d9488",s:["Header","Greeting","Introduction","Skills & Experience","Projects","Closing Statement","Signature"]},
  {n:"Marketing Role",h:"left",c:"#f97316",s:["Header","Salutation","Intro","Key Achievements","Closing Paragraph","Call to Action","Signature"]},
  {n:"Academic / Research",h:"box",c:"#6b7280",s:["Sender Info","Date","Recipient Info","Salutation","Research Summary","Motivation","Closing","Signature"]}
];

const grid=document.getElementById("grid");
const viewer=document.getElementById("viewer");
const letter=document.getElementById("letter");

// populate grid
templates.forEach((t,i)=>{
  grid.innerHTML+=`
  <div class="card">
    <img src="${logo}">
    <h3>${t.n}</h3>
    <button onclick="openTemplate(${i})">View Template</button>
  </div>`;
});

function openTemplate(i){
  const t=templates[i];
  grid.style.display="none";
  viewer.classList.remove("hidden");

  letter.className=`letter`;
  letter.style.setProperty("--accent",t.c);

  const headerClass =
    t.h==="center"?"header-center":
    t.h==="box"?"header-box":"header-left";

  letter.innerHTML=`<div class="${headerClass}">
    <h1 contenteditable>Your Name</h1>
    <p contenteditable>Email | Phone | LinkedIn</p>
  </div>
  <div class="body">
    ${render(t.s)}
  </div>`;
}

function render(arr){
  return arr.map(x=>`
  <div class="section">
    <h3>${x}</h3>
    <p contenteditable>Edit ${x} here...</p>
  </div>`).join("");
}

function closeView(){
  viewer.classList.add("hidden");
  grid.style.display="grid";
}

function download(){
  html2pdf().from(letter).save("cover_letter.pdf");
}

function changeColor(c){
  letter.style.setProperty("--accent",c);
}
</script>

</body>
</html>
