</head>
<body class="bg-gray-100">

<header class="bg-blue-700 text-white p-5 flex items-center gap-4">
  <img src="quizlogo.jpg" class="w-10 h-10">
  <h2 class="text-xl font-semibold">Quiz Hub - Resources</h2>
</header>

<div id="quizGrid" class="grid grid-cols-4 gap-6 p-6">
  <!-- Quiz cards will be generated here -->
</div>

<div id="quizViewer" class="hidden p-6">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded shadow">
    <div class="flex justify-between items-center mb-4">
      <h2 id="quizTitle" class="text-xl font-bold"></h2>
      <button class="bg-red-500 text-white px-4 py-2 rounded" onclick="exitQuiz()">Exit Quiz</button>
    </div>
    <div id="questionContainer"></div>
    <div class="mt-4 flex justify-between">
      <button id="prevBtn" class="bg-gray-400 text-white px-4 py-2 rounded" onclick="prevQuestion()">Previous</button>
      <button id="nextBtn" class="bg-blue-700 text-white px-4 py-2 rounded" onclick="nextQuestion()">Next</button>
      <button id="submitBtn" class="bg-green-600 text-white px-4 py-2 rounded hidden" onclick="showScore()">Submit</button>
    </div>
  </div>
</div>

<div id="scoreCard" class="hidden text-center p-6">
  <h2 class="text-3xl font-bold text-green-700 mb-4">Your Score: <span id="score"></span>/20</h2>
  <button class="bg-blue-700 text-white px-5 py-2 rounded" onclick="exitQuiz()">Exit</button>
</div>

const grid = document.getElementById("quizGrid");
for(const category of ["aptitude","technical","interview"]){
  quizzesData[category].forEach((qset)=>{
    grid.innerHTML += `
    <div class="bg-white p-5 rounded-lg shadow text-center">
      <img src="quizlogo.jpg" class="w-16 mx-auto mb-3">
      <h3 class="font-bold mb-2">${qset.title}</h3>
      <p class="mb-2 text-gray-600 capitalize">${category} Quiz</p>
      <button class="bg-blue-700 text-white px-4 py-2 rounded" onclick="startQuiz('${category}','${qset.title}')">Start Quiz</button>
    </div>`;
  });
}

// -------------------- QUIZ LOGIC --------------------
let currentQuiz=[], currentIndex=0, score=0, userAnswers=[], quizTitle="";

function startQuiz(category,title){
  currentQuiz = quizzesData[category].find(q=>q.title===title).questions;
  quizTitle = title;
  currentIndex = 0;
  score = 0;
  userAnswers = Array(currentQuiz.length).fill(null);
  document.getElementById("quizGrid").style.display="none";
  document.getElementById("quizViewer").classList.remove("hidden");
  document.getElementById("scoreCard").classList.add("hidden");
  document.getElementById("quizTitle").innerText = quizTitle;
  showQuestion();
}

function showQuestion(){
  const q = currentQuiz[currentIndex];
  let html = `<h3 class="text-lg font-semibold mb-4">Q${currentIndex+1}. ${q.q}</h3><ul class="space-y-2">`;
  q.options.forEach((opt,i)=>{
    const checked = userAnswers[currentIndex]===i?'checked':'';
    html += `<li><label class="block p-3 border rounded hover:bg-gray-100 cursor-pointer">
      <input type="radio" name="option" value="${i}" ${checked}> ${opt}</label></li>`;
  });
  html += `</ul>`;
  document.getElementById("questionContainer").innerHTML = html;
  document.getElementById("prevBtn").style.display = currentIndex===0 ? "none":"inline-block";
  document.getElementById("nextBtn").style.display = currentIndex===currentQuiz.length-1 ? "none":"inline-block";
  document.getElementById("submitBtn").style.display = currentIndex===currentQuiz.length-1 ? "inline-block":"none";
}

function saveAnswer(){
  const selected = document.querySelector('input[name="option"]:checked');
  if(selected) userAnswers[currentIndex] = parseInt(selected.value);
}

function nextQuestion(){
  saveAnswer();
  if(currentIndex<currentQuiz.length-1) currentIndex++;
  showQuestion();
}

function prevQuestion(){
  saveAnswer();
  if(currentIndex>0) currentIndex--;
  showQuestion();
}

function showScore(){
  saveAnswer();
  score = userAnswers.reduce((acc,val,i)=> val===currentQuiz[i].answer ? acc+1:acc,0);
  document.getElementById("quizViewer").classList.add("hidden");
  document.getElementById("scoreCard").classList.remove("hidden");
  document.getElementById("score").innerText = score;
}

function exitQuiz(){
  document.getElementById("quizViewer").classList.add("hidden");
  document.getElementById("scoreCard").classList.add("hidden");
  document.getElementById("quizGrid").style.display="grid";
}
